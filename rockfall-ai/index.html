<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rockfall AI — Sign In</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-visual">
      <div class="site-id">SITE 14 · BENCH SECTOR B — OPEN PIT</div>
      <h1>Rockfall AI</h1>
      <p>Slope-stability monitoring for open-pit operations. Drone and fixed-camera telemetry, classified and explained in real time.</p>
    </div>
    <div class="auth-form-col">
      <form class="auth-form" id="auth-form" novalidate>
        <div class="brand">ROCKFALL AI</div>
        <h2 id="mode-title">Sign in to command center</h2>
        <p class="sub" id="mode-sub">Enter your credentials to view live telemetry.</p>

        <div class="form-msg" id="form-msg"></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        </div>
        <div class="field" id="role-field" style="display:none;">
          <label for="role">Requested role</label>
          <select id="role">
            <option value="worker">Mine worker (fixed camera)</option>
            <option value="admin">Administrator (UAV ops)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
        <div class="form-toggle">
          <button type="button" id="toggle-mode">Create an account instead</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
